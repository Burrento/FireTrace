# Place this at: .github/workflows/build-backend.yml
# (create the .github/workflows/ folders if they don't exist yet)
#
# This builds the Docker image using GitHub's own servers and pushes the
# result straight to your Container Registry — it does NOT use ACR Tasks,
# so it works fine on the Azure for Students subscription.

name: Build and Push Backend Image

on:
  workflow_dispatch:      # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Pipfile"
      - "Pipfile.lock"
      - "FireTrace/**"
      - ".github/workflows/build-backend.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: firetraceacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: firetraceacr.azurecr.io/firetrace-backend:latest
